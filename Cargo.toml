[package]
name = "esign"
version = "0.1.0"
edition = "2021"
description = "Сервис подписания ГОСТ ЭП (тестовая сборка)"

[features]
default = []
# Тестовый провайдер на OpenSSL + gost-engine. В Docker-сборку не входит.
openssl-dev = ["dep:openssl", "dep:openssl-sys", "dep:foreign-types"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
moka = { version = "0.12", features = ["future"] }
prometheus = "0.14"
governor = "0.10"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha1 = "0.10"
rand = "0.9"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
x509-parser = "0.17"
libloading = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
percent-encoding = "2"
once_cell = "1"
openssl = { version = "0.10", optional = true }
openssl-sys = { version = "0.9", optional = true }
foreign-types = { version = "0.3", optional = true }

[profile.release]
lto = "thin"
codegen-units = 4
